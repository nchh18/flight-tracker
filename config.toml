# SIN flight tracker settings. Edit freely; changes apply on the next run.
# Prices are in the currency below (SGD), for 1 adult, economy.

[schedule]
# GitHub runs the tracker every 8 hours (see .github/workflows/tracker.yml).
# This only stops a scheduled run from repeating a search that happened less
# than this many hours ago. Manual runs from the Actions tab always search.
min_hours_between_runs = 4

[dashboard]
top_n = 3              # fares shown per destination (and trip type)
lookback_days = 7      # only show fares seen in the last N days
# Paste your dashboard link here to include it in the daily Telegram summary,
# e.g. "https://<your-github-username>.github.io/<repo-name>/"
url = "https://nchh18.github.io/flight-tracker/"

[search]
origin = "SIN"
currency = "SGD"
adults = 1
cabin = "economy"               # economy | premium-economy | business | first

# Departure window, counted from today (up to 1 year). Airlines usually open
# sales about 11 months ahead, so the far end often has no flights yet; those
# searches are simply skipped and re-tried later.
days_ahead_min = 14
days_ahead_max = 365

# Searches per airport per run, for each trip type a destination uses. When
# this is 2 or more, one search re-checks the cheapest dates found recently and
# the rest explore new dates. Groups and destinations can override it (Europe
# uses 2, because it has many airports). With the settings below a run does
# 25 Asia-Pacific airports x 3 returns + 26 European airports x (2 one-way +
# 2 return) = 179 searches, about 15 minutes.
one_way_samples = 3
round_trip_samples = 3
recheck_best = true

# Transits are fine by default. Uncomment to cap the number of stops.
# max_stops = 2

# Hide "self-transfer" / separate-ticket itineraries. These are often cheaper,
# but if a leg is delayed and you miss the next one, the airline owes you nothing.
hide_self_transfer = true

# Never show itineraries that include any of these airlines (budget carriers).
# A flight is skipped if any leg is on one of them. Remove a name to allow it,
# or add one using the airline's name as Google Flights shows it.
exclude_airlines = [
  # Southeast Asia
  "Scoot", "AirAsia", "Jetstar", "VietJet", "Vietjet Air", "Cebu Pacific", "Lion Air",
  "Citilink", "Super Air Jet", "Nok Air", "Vietravel Airlines",
  # North Asia
  "ZIPAIR", "Peach", "Spring Airlines", "Spring Japan", "HK Express", "Tigerair",
  "Jeju Air", "Jin Air", "T'way Air", "Air Busan", "Air Seoul", "Eastar Jet",
  # South Asia and Middle East
  "IndiGo", "Air India Express", "SpiceJet", "Akasa Air", "flydubai", "Air Arabia", "flynas",
  # Europe
  "Ryanair", "easyJet", "Wizz Air", "Vueling", "Transavia", "Eurowings", "Volotea",
  "Norwegian", "Pegasus", "AJet", "Jet2", "PLAY", "Norse Atlantic", "French bee", "LEVEL",
]

# Random pause between searches (seconds). Keeps the traffic polite.
delay_seconds = [2.0, 5.0]

[alerts]
# Alert when a fare is this % below the typical (median) price seen for that
# destination recently. Needs a few days of history before it starts working.
drop_pct = 25
baseline_days = 30
min_samples = 15

# Don't repeat an alert for the same flight dates unless it drops another 5%.
realert_drop_pct = 5
max_alerts_per_run = 8

# Daily summary on Telegram: sent by the first run at or after this hour
# (Singapore time), covering the cheapest fares seen over the last N hours.
digest_hour_sgt = 8
digest_lookback_hours = 72

# How long to keep price history (days).
history_days = 60

# ---------------------------------------------------------------------------
# Groups hold shared settings for their destinations; a destination's own
# settings override its group's. Settings:
#   trips              which fares to search: ["return"], ["one-way"] or both
#   trip_lengths       return-trip lengths in days (one is picked per search)
#   round_trip_target  alert whenever a return fare is at or below this (0 = off)
#   one_way_target     same, for one-way fares
#   one_way_samples / round_trip_samples   override the searches per airport
# Targets are rough starting guesses for full-service airlines. Tune them once
# you've seen a week of real prices.
# ---------------------------------------------------------------------------

[groups.asia]
label = "Asia-Pacific"
trips = ["return"]

[groups.europe]
label = "Europe"
trips = ["one-way", "return"]
trip_lengths = [10, 14]
one_way_samples = 2
round_trip_samples = 2
one_way_target = 650
round_trip_target = 1050

